name: Permanently Free Headless Forge Bot
on:
  push:
  schedule:
    - cron: '0 */4 * * *' 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Launch Headless Minecraft Bot
        run: node index.js
        env:
          BOT_HOST: ${{ secrets.BOT_HOST }}
          BOT_PORT: ${{ secrets.BOT_PORT }}
